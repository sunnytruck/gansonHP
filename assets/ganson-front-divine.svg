<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="t d">
  <title id="t">岩尊けいと 神格化イメージ</title>
  <desc id="d">暗背景に鈍い金で縁取られた岩の巨体と肩の「じ」「と」、胸の「じっと教」を描いたビジュアル。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0f13"/>
      <stop offset="1" stop-color="#141922"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9e8458"/>
      <stop offset="1" stop-color="#746242"/>
    </linearGradient>
    <filter id="g"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <ellipse cx="450" cy="1020" rx="280" ry="70" fill="#000" opacity="0.45"/>
  <circle cx="450" cy="230" r="120" fill="url(#rock)"/>
  <rect x="295" y="320" width="310" height="360" rx="80" fill="url(#rock)"/>
  <rect x="185" y="330" width="140" height="120" rx="45" fill="url(#rock)"/>
  <rect x="575" y="330" width="140" height="120" rx="45" fill="url(#rock)"/>
  <rect x="205" y="450" width="120" height="300" rx="50" fill="url(#rock)"/>
  <rect x="575" y="450" width="120" height="300" rx="50" fill="url(#rock)"/>
  <rect x="320" y="680" width="110" height="360" rx="48" fill="url(#rock)"/>
  <rect x="470" y="680" width="110" height="360" rx="48" fill="url(#rock)"/>
  <rect x="285" y="1000" width="160" height="75" rx="28" fill="url(#rock)"/>
  <rect x="455" y="1000" width="160" height="75" rx="28" fill="url(#rock)"/>
  <g fill="none" stroke="#d2b679" stroke-opacity="0.65">
    <circle cx="450" cy="250" r="180"/>
    <circle cx="450" cy="250" r="220" opacity="0.4"/>
  </g>
  <g fill="#f0ddaa" font-family="'Yu Gothic', sans-serif" font-weight="700">
    <text x="252" y="408" font-size="74">じ</text>
    <text x="622" y="408" font-size="74">と</text>
    <text x="365" y="540" font-size="76">じっと教</text>
  </g>
  <circle cx="410" cy="225" r="8" fill="#322a1d"/>
  <circle cx="490" cy="225" r="8" fill="#322a1d"/>
  <path d="M390 280 Q450 300 510 280" fill="none" stroke="#4d402c" stroke-width="8"/>
  <ellipse cx="450" cy="180" rx="300" ry="140" fill="#d2b679" opacity="0.15" filter="url(#g)"/>
</svg>
